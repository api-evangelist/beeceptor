  /v2/endpoints/{endpoint}/specs:
    get:
      summary: Get specification details
      description: Returns the metadata and current configuration of the uploaded API specification (OAS, WSDL, gRPC, or GraphQL).
      tags: [Endpoint Settings]
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/EndpointName'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [openapi, grpc, graphql, wsdl]
                      intelligenceMock:
                        type: boolean
              example:
                data:
                  type: openapi
                  intelligenceMock: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Upload API specification (Async)
      description: |
        Uploads an OpenAPI (YAML/JSON), WSDL, GraphQL, or Proto file to automate mock 
        response generation. This is an asynchronous operation that returns a Job ID.
      tags: [Endpoint Settings]
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/EndpointName'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The specification file to upload (Max 2.5MB).
                intelligenceMock:
                  type: boolean
                  description: Enable AI-driven mock response generation.
      responses:
        '202':
          description: Upload accepted and processing initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              example:
                jobId: job-9a7f3b2c1d
                status: QUEUED
                type: oas
                message: Job queued for oas processing
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      summary: Delete API specification
      description: |
        Removes the uploaded API specification and stops any automated mock 
        behaviors tied to it.
      tags: [Endpoint Settings]
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/EndpointName'
      responses:
        '200':
          description: Specification deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted:
                        type: boolean
              example:
                data:
                  deleted: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v2/endpoints/{endpoint}/jobs/{jobId}:
    get:
      summary: Get job status
      description: Polls the status of an asynchronous background job using the Job ID returned during a specification upload.
      tags: [Endpoint Settings]
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/EndpointName'
        - in: path
          name: jobId
          required: true
          schema:
            type: string
          example: job-6a1ed3b07798
      responses:
        '200':
          description: Job status retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              example:
                jobId: job-6a1ed3b07798
                status: COMPLETED
                message: Job completed successfully
                result:
                  channelId: endpoint-name
                  dashboardUrl: "https://app.beeceptor.com/console/endpoint-name"
                completedAt: '2026-01-28T09:31:02.729Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
